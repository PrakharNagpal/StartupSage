services:
  - type: web
    name: startupsage-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-ai.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_PATH
        value: data/startupsage.db
      - key: OPENAI_API_KEY
        sync: false
      - key: HYPERSPELL_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_FORMAT
        value: mp3
